<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Моніторинг{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f5f8; color: #172b42; margin: 0; }
        main { max-width: 760px; margin: 40px auto; padding: 28px; background: white; border-radius: 12px; }
        a { color: #155b9d; }
        input, button { padding: 10px; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        nav { margin-bottom: 24px; }
    </style>
</head>
<body>
<main>
    <nav><a href="{% url 'monitoring:index' %}">Пристрої</a> | <a href="{% url 'admin:index' %}">Адміністрування</a></nav>
    {% block content %}{% endblock %}
</main>
</body>
</html>
